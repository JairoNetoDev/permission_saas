# Config Server: serve a configuração centralizada dos outros serviços. Os arquivos
# ficam em config-repo/ na raiz do repositório (backend "native", lido do disco):
# <aplicação>-<profile>.yml vale para uma aplicação, application-<profile>.yml para todas.
spring:
  application:
    name: config-server

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:../config-repo}

server:
  port: ${SERVER_PORT:8888}

management:
  endpoints:
    web:
      exposure:
        include: health,info
