# Configuração comum a todos os ambientes. O que muda entre eles (banco,
# endereço do audit-service, segredos, log de SQL) fica em application-dev.yml
# e application-prod.yml.
spring:
  application:
    name: permission-service

  # Sem SPRING_PROFILES_ACTIVE, sobe como desenvolvimento. O Docker Compose ativa o prod.
  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing,*:future"
    validate-on-migrate: false

  # A gravação da auditoria roda na thread da validação de permissão: com o
  # default do Feign (60s de leitura), um audit-service travado prenderia cada
  # validação por um minuto.
  cloud:
    openfeign:
      client:
        config:
          audit-service:
            connect-timeout: 1000
            read-timeout: 2000

app:
  jwt:
    expiration-ms: 3600000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  show-actuator: true
