services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: permissions_saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas123
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - permission_saas_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d permissions_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  audit-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit123
    ports:
      - "5433:5432"
    volumes:
      - audit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    depends_on:
      audit-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://audit-postgres:5432/audit_db
      SPRING_DATASOURCE_USERNAME: audit
      SPRING_DATASOURCE_PASSWORD: audit123
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
    volumes:
      - audit_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8081:8081"
      - "5006:5006"
    develop:
      watch:
        - action: rebuild
          path: ./audit-service/src
        - action: rebuild
          path: ./audit-service/pom.xml

  permission-service:
    build:
      context: ./permission-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/permissions_saas
      SPRING_DATASOURCE_USERNAME: saas
      SPRING_DATASOURCE_PASSWORD: saas123
      AUDIT_SERVICE_URL: http://audit-service:8081
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8080:8080"
      - "5005:5005"
    develop:
      watch:
        - action: rebuild
          path: ./permission-service/src
        - action: rebuild
          path: ./permission-service/pom.xml
        - action: rebuild
          path: ./.env

volumes:
  permission_saas_pgdata:
  audit_pgdata:
  audit_logs:
